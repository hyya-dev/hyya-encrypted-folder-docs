name: Bug report
description: Something in hYYa Encrypted Folder isn't working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't attach your own private files, and don't report a security problem here: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How can we repeat it?
      description: The steps, one per line.
  - type: input
    id: version
    attributes:
      label: hYYa Encrypted Folder version
      description: Shown on the app's page in the App Store or Google Play
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Mac, iPhone, iPad, Android]
    validations: { required: true }
  - type: input
    id: system
    attributes:
      label: System version
      description: e.g. macOS 26.1, iOS 26.2, Android 16
  - type: dropdown
    id: location
    attributes:
      label: Where is the folder kept?
      options: [This device, iCloud, Google Drive, Not about a folder]
